<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aether Calc - Premium Smart Calculator</title>
  
  <!-- Premium Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="styles.css">
</head>
<body class="dark-theme">
  <!-- Interactive Background Gradients -->
  <div class="bg-gradient-glow"></div>
  <div class="bg-gradient-glow secondary"></div>

  <main class="app-container">
    <div class="calculator-card">
      
      <!-- Top Control Bar -->
      <header class="calc-header">
        <div class="brand">
          <span class="brand-logo">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 9h16M4 15h16M10 4v16M14 4v16" />
            </svg>
          </span>
          <span class="brand-name">AetherCalc</span>
        </div>
        
        <div class="controls-group">
          <!-- Theme Accent Picker -->
          <div class="accent-selector" title="Change accent color">
            <button class="accent-dot active" data-accent="purple" style="--accent-color: #a855f7;"></button>
            <button class="accent-dot" data-accent="blue" style="--accent-color: #3b82f6;"></button>
            <button class="accent-dot" data-accent="emerald" style="--accent-color: #10b981;"></button>
            <button class="accent-dot" data-accent="rose" style="--accent-color: #f43f5e;"></button>
          </div>

          <!-- History Toggle Button -->
          <button id="history-btn" class="icon-btn" title="View History">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
          </button>
          
          <!-- Mode Selector (Standard / Scientific) -->
          <div class="mode-toggle-container">
            <button id="mode-std" class="mode-tab active">Std</button>
            <button id="mode-sci" class="mode-tab">Sci</button>
            <div class="mode-indicator-slider"></div>
          </div>
        </div>
      </header>

      <!-- Calculator Display -->
      <section class="calc-display-container">
        <!-- Scrollable Expression Screen -->
        <div class="expression-wrapper">
          <div id="expression-screen" class="expression-text"></div>
        </div>
        <!-- Main Interactive Input Screen -->
        <div class="input-wrapper">
          <div id="input-screen" class="input-text">0</div>
        </div>
      </section>

      <!-- Calculator Keyboard Area -->
      <section class="calc-keypad-container">
        <!-- Scientific Keypad Drawer (Animates in/out) -->
        <div id="scientific-keypad" class="keypad-grid scientific-keys collapsed">
          <button class="btn btn-sci" data-action="sin" title="Sine">sin</button>
          <button class="btn btn-sci" data-action="cos" title="Cosine">cos</button>
          <button class="btn btn-sci" data-action="tan" title="Tangent">tan</button>
          <button class="btn btn-sci" data-action="deg-rad" id="deg-rad-toggle" title="Toggle Degrees / Radians">Rad</button>
          
          <button class="btn btn-sci" data-action="log" title="Logarithm (base 10)">log</button>
          <button class="btn btn-sci" data-action="ln" title="Natural Logarithm">ln</button>
          <button class="btn btn-sci" data-val="^" title="Power (x^y)">x<sup>y</sup></button>
          <button class="btn btn-sci" data-val="sqrt(" title="Square Root">√</button>
          
          <button class="btn btn-sci" data-val="pi" title="Pi (3.14159...)">π</button>
          <button class="btn btn-sci" data-val="e" title="Euler's Number (2.71828...)">e</button>
          <button class="btn btn-sci" data-action="fact" title="Factorial (x!)">x!</button>
          <button class="btn btn-sci" data-val="%" title="Modulo / Percentage">%</button>
          
          <button class="btn btn-sci" data-val="(" title="Open Parenthesis">(</button>
          <button class="btn btn-sci" data-val=")" title="Close Parenthesis">)</button>
          <button class="btn btn-sci" data-action="square" title="Square (x^2)">x²</button>
          <button class="btn btn-sci" data-action="recip" title="Reciprocal (1/x)">1/x</button>
        </div>

        <!-- Standard Keypad (Always visible) -->
        <div class="keypad-grid standard-keys">
          <!-- Row 1 -->
          <button class="btn btn-action" id="btn-clear" data-action="clear" title="Clear (Esc)">AC</button>
          <button class="btn btn-action" data-action="backspace" title="Backspace (Backspace)">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 4H8l-7 8 7 8h13a2 2 0 002-2V6a2 2 0 00-2-2zM18 9l-6 6M12 9l6 6"/>
            </svg>
          </button>
          <button class="btn btn-action" data-action="negate" title="Positive/Negative Toggle">±</button>
          <button class="btn btn-operator" data-val="/" title="Divide (/)">÷</button>
          
          <!-- Row 2 -->
          <button class="btn btn-num" data-val="7">7</button>
          <button class="btn btn-num" data-val="8">8</button>
          <button class="btn btn-num" data-val="9">9</button>
          <button class="btn btn-operator" data-val="*" title="Multiply (*)">×</button>
          
          <!-- Row 3 -->
          <button class="btn btn-num" data-val="4">4</button>
          <button class="btn btn-num" data-val="5">5</button>
          <button class="btn btn-num" data-val="6">6</button>
          <button class="btn btn-operator" data-val="-" title="Subtract (-)">−</button>
          
          <!-- Row 4 -->
          <button class="btn btn-num" data-val="1">1</button>
          <button class="btn btn-num" data-val="2">2</button>
          <button class="btn btn-num" data-val="3">3</button>
          <button class="btn btn-operator" data-val="+" title="Add (+)">+</button>
          
          <!-- Row 5 -->
          <button class="btn btn-num double-width" data-val="0">0</button>
          <button class="btn btn-num" data-val=".">.</button>
          <button class="btn btn-equals" id="btn-equals" data-action="equals" title="Calculate (Enter)">=</button>
        </div>
      </section>
    </div>

    <!-- Slide-Out History Drawer -->
    <aside id="history-drawer" class="history-drawer">
      <div class="drawer-header">
        <h3>Calculation History</h3>
        <button id="close-history-btn" class="icon-btn" title="Close History">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>
      <div class="drawer-content">
        <ul id="history-list" class="history-list">
          <!-- Dynamically populated -->
        </ul>
        <div id="history-empty" class="history-empty">
          <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="empty-icon">
            <path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          <p>No history yet</p>
          <span>Calculations you make will appear here.</span>
        </div>
      </div>
      <div class="drawer-footer">
        <button id="clear-history-btn" class="btn btn-clear-history">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6" />
            <path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2" />
          </svg>
          Clear History
        </button>
      </div>
    </aside>
    
    <!-- Toast Notification for Info/Errors -->
    <div id="toast" class="toast-notification">Calculation copied!</div>
  </main>

  <!-- Core Logic Script -->
  <script src="app.js"></script>
</body>
</html>
